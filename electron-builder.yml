appId: com.markdowneditor.app
productName: GD Markdown Composer

# Electron entry point: "main" in package.json (electron/main.cjs)

directories:
  output: electron-dist

# Files to include in the packaged app
files:
  - dist/**/*
  - electron/main.cjs
  - electron/preload.cjs
  - electron/icons/icon-256.png
  # The server (dist/index.js) and the page are fully bundled, so the app needs
  # no node_modules at runtime; leaving them out keeps the install small.
  - "!node_modules/**/*"
  - package.json

asar: true

# The server bundle runs under the bundled Bun binary, which cannot read
# files from inside app.asar, so dist/ ships unpacked next to it.
asarUnpack:
  - dist/**/*

# Registers the app as an "Open with" handler (and lets it be chosen as the
# default) for these types. The path arrives in argv / 'open-file' and is
# opened by electron/main.cjs.
fileAssociations:
  - ext: [md, markdown]
    name: Markdown Document
    description: Markdown document
    role: Editor
  - ext: [mermaid, mmd]
    name: Mermaid Diagram
    description: Mermaid diagram
    role: Editor

# PlantUML jar (run with the user's Java), fetched by script/fetch-vendor.mjs.
extraResources:
  - from: "vendor/plantuml/"
    to: "plantuml"
    filter: ["plantuml.jar"]

# Bundle the per-platform Bun runtime that the server needs (bun:sqlite).
# Paths match the folders written by script/fetch-bun.mjs. electron-builder's
# ${os} macro expands to win/mac/linux, which does not match those names, so
# each platform lists its own folder.

# macOS
mac:
  category: public.app-category.productivity
  icon: electron/icons/icon.png
  extraResources:
    - from: "bin/bun-darwin-${arch}/"
      to: "."
      filter: ["bun"]
  target:
    - target: dmg
      arch:
        - x64
        - arm64

# Windows
win:
  icon: electron/icons/icon.png
  extraResources:
    - from: "bin/bun-windows-${arch}/"
      to: "."
      filter: ["bun.exe"]
  target:
    - target: nsis
      arch:
        - x64

# Linux
linux:
  icon: electron/icons/icon.png
  extraResources:
    - from: "bin/bun-linux-${arch}/"
      to: "."
      filter: ["bun"]
  target:
    - target: AppImage
      arch:
        - x64
  category: Utility
