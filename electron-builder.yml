appId: com.markdowneditor.app
productName: Markdown Editor

# Electron entry point
main: electron/main.cjs

directories:
  output: electron-dist

# Files to include in the packaged app
files:
  - dist/**/*
  - electron/main.cjs
  - package.json

asar: true

# Bundle the per-platform Bun runtime that the server needs (bun:sqlite).
# electron-builder matches the OS/arch of the build host, so we ship only
# the binary for the target platform.
extraResources:
  - from: "bin/bun-${os}-${arch}/"
    to: "."
    filter: ["bun", "bun.exe"]

# macOS
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - x64
        - arm64

# Windows
win:
  target:
    - target: nsis
      arch:
        - x64

# Linux
linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Utility