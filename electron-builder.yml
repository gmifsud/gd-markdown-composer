appId: com.markdowneditor.app
productName: Markdown Editor

# Electron entry point: "main" in package.json (electron/main.cjs)

directories:
  output: electron-dist

# Files to include in the packaged app
files:
  - dist/**/*
  - electron/main.cjs
  - package.json

asar: true

# The server bundle runs under the bundled Bun binary, which cannot read
# files from inside app.asar, so dist/ ships unpacked next to it.
asarUnpack:
  - dist/**/*

# Bundle the per-platform Bun runtime that the server needs (bun:sqlite).
# Paths match the folders written by script/fetch-bun.mjs. electron-builder's
# ${os} macro expands to win/mac/linux, which does not match those names, so
# each platform lists its own folder.

# macOS
mac:
  category: public.app-category.productivity
  extraResources:
    - from: "bin/bun-darwin-${arch}/"
      to: "."
      filter: ["bun"]
  target:
    - target: dmg
      arch:
        - x64
        - arm64

# Windows
win:
  extraResources:
    - from: "bin/bun-windows-${arch}/"
      to: "."
      filter: ["bun.exe"]
  target:
    - target: nsis
      arch:
        - x64

# Linux
linux:
  extraResources:
    - from: "bin/bun-linux-${arch}/"
      to: "."
      filter: ["bun"]
  target:
    - target: AppImage
      arch:
        - x64
  category: Utility
